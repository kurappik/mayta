<form method="get" action="{% url 'pharmacy:catalog' %}" class="panel filters" id="catalog-filter-form" data-live-filter>
  <h2>Фильтры</h2>
  <label for="q">Название или вещество</label>
  <input id="q" type="search" name="q" value="{{ q }}" placeholder="Поиск по каталогу">
  <label for="form">Форма выпуска</label>
  <select id="form" name="form">
    <option value="">Любая</option>
    {% for item in forms %}<option value="{{ item }}" {% if selected_form == item %}selected{% endif %}>{{ item }}</option>{% endfor %}
  </select>
  <label for="rx">Рецепт</label>
  <select id="rx" name="rx">
    <option value="" {% if not rx %}selected{% endif %}>Все препараты</option>
    <option value="no" {% if rx == 'no' %}selected{% endif %}>Без рецепта</option>
    <option value="yes" {% if rx == 'yes' %}selected{% endif %}>По рецепту</option>
  </select>
  <label for="sort">Сортировка</label>
  <select id="sort" name="sort">
    <option value="name" {% if sort == 'name' %}selected{% endif %}>По названию</option>
    <option value="price" {% if sort == 'price' %}selected{% endif %}>Сначала дешевле</option>
    <option value="-price" {% if sort == '-price' %}selected{% endif %}>Сначала дороже</option>
  </select>
  <button type="submit" class="btn full">Показать</button>
  <a class="text-link" href="{% url 'pharmacy:catalog' %}">Сбросить фильтры</a>
</form>
